name: Backend CI

on:
    pull_request:
        branches:
            - main

    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: Test Firebase backend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install root dependencies
              run: npm ci

            - name: Install Funstions dependencies
              working-directory: functions
              run: npm ci

            - name: Run lint
              working-directory: functions
              run: npm run lint

            - name: Run test
              working-directory: functions
              run: npm test
